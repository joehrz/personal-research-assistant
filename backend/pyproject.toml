[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pra"
version = "0.1.0"
description = "Personal Research Assistant - local-first notes, tasks, and research capture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "icalendar>=5.0",
    "recurring-ical-events>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
desktop = [
    "pywebview>=5.0",
    "keyboard>=0.13",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["pra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
